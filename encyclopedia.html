<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#01080e" />
    <title>OCEAN ODYSSEY - Bách Khoa Thủy Quái &amp; OMEGA NYX-0</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      html,
      body {
        min-height: 100dvh;
        background: radial-gradient(
          circle at top center,
          #04233b 0%,
          #010b14 55%,
          #010509 100%
        );
        color: #f1faee;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .ency-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px 16px 48px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .ency-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        background: rgba(4, 22, 36, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(100, 223, 223, 0.35);
        border-radius: 18px;
        padding: 14px 18px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55);
      }

      .ency-title h1 {
        font-size: clamp(20px, 3.6vw, 28px);
        font-weight: 900;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #00f5d4, #00bbf9, #fee440);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .ency-title p {
        font-size: 12.5px;
        color: #90e0ef;
        margin-top: 3px;
      }

      .ency-nav-btns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn-nav {
        padding: 9px 16px;
        border-radius: 12px;
        border: 1.5px solid rgba(0, 245, 212, 0.5);
        background: rgba(0, 245, 212, 0.14);
        color: #00f5d4;
        font-size: 12.5px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-nav:hover {
        background: rgba(0, 245, 212, 0.28);
        box-shadow: 0 0 16px rgba(0, 245, 212, 0.35);
      }

      .btn-nav.primary {
        border: none;
        background: linear-gradient(90deg, #00f5d4, #00bbf9);
        color: #011627;
        font-weight: 900;
      }

      .controls-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .tabs-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tab-btn {
        padding: 10px 16px;
        border-radius: 12px;
        border: 1.5px solid rgba(100, 223, 223, 0.25);
        background: rgba(4, 22, 36, 0.8);
        color: #a8dadc;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
      }

      .tab-btn:hover {
        border-color: #00f5d4;
        color: #ffffff;
      }

      .tab-btn.active {
        background: linear-gradient(90deg, #00f5d4, #00bbf9);
        color: #011627;
        border-color: transparent;
        box-shadow: 0 4px 18px rgba(0, 245, 212, 0.35);
      }

      .tab-btn.omega-tab.active {
        background: linear-gradient(90deg, #ff006e, #fee440);
        color: #090d15;
        box-shadow: 0 4px 18px rgba(255, 0, 110, 0.45);
      }

      .search-input {
        width: 280px;
        max-width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1.5px solid rgba(0, 245, 212, 0.4);
        background: rgba(2, 12, 22, 0.88);
        color: #ffffff;
        font-size: 13px;
        outline: none;
      }

      .search-input:focus {
        border-color: #fee440;
      }

      .section-heading {
        font-size: 16px;
        font-weight: 900;
        color: #fee440;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
        gap: 14px;
      }

      .cards-grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 14px;
      }

      .ency-card {
        background: rgba(6, 26, 42, 0.88);
        border: 1.5px solid rgba(100, 223, 223, 0.28);
        border-radius: 16px;
        padding: 15px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        transition:
          transform 0.15s,
          border-color 0.2s;
      }

      .ency-card:hover {
        transform: translateY(-3px);
        border-color: #00f5d4;
      }

      .ency-card.emp-card {
        border-color: rgba(255, 84, 0, 0.6);
        background: linear-gradient(
          155deg,
          rgba(54, 16, 12, 0.88),
          rgba(12, 8, 12, 0.94)
        );
      }

      .ency-card.ele-card {
        border-color: rgba(0, 245, 212, 0.6);
        background: linear-gradient(
          155deg,
          rgba(8, 46, 62, 0.88),
          rgba(4, 16, 28, 0.94)
        );
      }

      .ency-card.boss-card {
        border-color: rgba(199, 125, 255, 0.65);
        background: linear-gradient(
          155deg,
          rgba(46, 10, 78, 0.88),
          rgba(10, 6, 24, 0.95)
        );
      }

      .ency-card.rainbow-card {
        border: 2px solid #fee440;
        background: linear-gradient(
          135deg,
          rgba(65, 10, 56, 0.9),
          rgba(12, 24, 52, 0.94)
        );
        box-shadow: 0 0 24px rgba(254, 228, 64, 0.28);
      }

      .omega-hero {
        border: 2px solid #ff006e;
        border-radius: 20px;
        padding: 20px 22px;
        background: linear-gradient(
          135deg,
          rgba(62, 4, 34, 0.92),
          rgba(18, 4, 38, 0.96)
        );
        box-shadow:
          0 0 38px rgba(255, 0, 110, 0.32),
          inset 0 0 28px rgba(254, 228, 64, 0.08);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .omega-hero-top {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .omega-avatar {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        background: radial-gradient(circle, #ff006e44, #090d15);
        border: 2px solid #fee440;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        box-shadow: 0 0 22px rgba(255, 0, 110, 0.5);
      }

      .omega-synergy-box {
        background: rgba(16, 4, 28, 0.82);
        border: 1px dashed rgba(232, 121, 249, 0.55);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12.5px;
        color: #f3e8ff;
        line-height: 1.55;
      }

      .pill-tag {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 900;
        background: rgba(255, 255, 255, 0.1);
        color: #fee440;
      }

      .pill-tag.omega {
        background: linear-gradient(90deg, #ff006e, #fee440);
        color: #090d15;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        color: #caf0f8;
      }

      .swatch-bar {
        height: 8px;
        border-radius: 999px;
        width: 100%;
      }

      .hidden {
        display: none !important;
      }

      .empty-state {
        text-align: center;
        padding: 36px 16px;
        color: #90e0ef;
        font-size: 14px;
        background: rgba(4, 22, 36, 0.65);
        border-radius: 16px;
        border: 1px dashed rgba(100, 223, 223, 0.35);
      }

      @media (max-width: 640px) {
        .stat-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

  </head>

    <div class="ency-shell">
      <header class="ency-topbar">
        <div class="ency-title">
          <h1>📖 BÁCH KHOA THỦY QUÁI &amp; OMEGA</h1>
          <p id="ency-subtitle">
            Tra cứu 13 Chuẩn Tiến Hóa • Công Thức Lõi Siêu Cấp • Nhân Vật OMEGA
            NYX-0 • Raid Boss
          </p>
        </div>
        <div class="ency-nav-btns">
          <a href="./index.html" class="btn-nav">🏠 Về Sảnh Chính</a>
          <a href="./game.html" class="btn-nav primary">⚔️ Vào Đấu Trường</a>
        </div>
      </header>

      <div class="controls-bar">
        <div class="tabs-row" id="ency-tabs">
          <button
            type="button"
            class="tab-btn active"
            data-tab="evolution"
            id="tab-btn-evolution"
          >
            🧬 13 Chuẩn Tiến Hóa
          </button>
          <button type="button" class="tab-btn" data-tab="augments">
            🌟 Lõi Siêu Cấp &amp; Công Thức
          </button>
          <button type="button" class="tab-btn omega-tab" data-tab="omega">
            🕳️ OMEGA NYX-0 &amp; Sinh Vật
          </button>
          <button type="button" class="tab-btn" data-tab="bosses">
            🐉 Raid Boss &amp; Lõi Boss
          </button>
        </div>

        <input
          type="text"
          id="ency-search"
          class="search-input"
          placeholder="🔍 Tìm kiếm (VD: Dạng 13, NYX-0, Băng, Leviathan)..."
        />
      </div>

      <main id="ency-content"></main>
    </div>

  </body>
</html>
